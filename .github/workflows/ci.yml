name: CI

# CI uses a containerised Postgres service because GitHub provides it for
# free. Local development does NOT require Docker -- see README section 1.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: schememedia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Audit finding H2: test_import.py, test_eligibility_matcher.py,
      # test_recommendation.py, test_api_routes.py, and the assistant tests
      # all skip -- not fail -- when schemes.json is absent, so CI reported
      # green while silently running well under half the suite. schemes.json
      # is now tracked (see .gitignore's comment), so this should never
      # trigger; it exists so a future regression (e.g. someone re-ignoring
      # the file) is a loud CI failure instead of a silent skip again.
      - name: Verify the real dataset is present (see .gitignore)
        working-directory: .
        run: |
          if [ ! -f schemes.json ]; then
            echo "::error::schemes.json is missing from the checkout -- test_import.py, test_eligibility_matcher.py, test_recommendation.py, test_api_routes.py, and the assistant tests will silently SKIP instead of running. It must be a tracked file (see .gitignore), not gitignored."
            exit 1
          fi

      # Audit finding M6: pyproject.toml's open `>=` ranges with no
      # lockfile meant CI could resolve different exact versions on
      # different days. constraints.txt (generated via `pip freeze` from a
      # known-good, fully-tested environment) pins every dependency without
      # changing pyproject.toml's own declared requirements.
      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy src

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/schememedia_test
        run: alembic upgrade head

      - name: Verify migrations reverse cleanly
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/schememedia_test
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/schememedia_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/schememedia_test
        run: pytest --cov=schememedia --cov-report=term-missing
