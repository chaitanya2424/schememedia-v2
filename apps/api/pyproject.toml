[project]
name = "schememedia-api"
version = "2.0.0"
description = "SchemeMedia API - government scheme discovery for India"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "structlog>=24.4.0",
    # Sync driver for the importer/embedding CLIs and test fixtures -- these
    # are one-shot batch jobs, not request-serving code, so they don't need
    # the async engine the app uses everywhere else.
    "psycopg[binary]>=3.2.0",
    # Embedding generation (REBUILD_PLAN F): all-MiniLM-L6-v2, 384 dims,
    # ONNX runtime -- no PyTorch, no GPU required.
    "fastembed>=0.4.0",
    # AI assistant (services/assistant.py). Grounded strictly in
    # RecommendationService output -- see that module's docstring. Both
    # providers are plain dependencies; each SDK is imported lazily inside
    # its own provider module (services/providers/), so selecting one
    # provider via LLM_PROVIDER never requires the other's credentials.
    "google-genai>=0.7.0",  # default dev provider -- has a free tier
    "anthropic>=0.70.0",  # optional, paid
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schememedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets tests import shared helpers from tests.conftest.
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
