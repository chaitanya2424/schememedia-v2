[project]
name = "schememedia-api"
version = "2.0.0"
description = "SchemeMedia API - government scheme discovery for India"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "structlog>=24.4.0",
    # Sync driver for the importer/embedding CLIs and test fixtures -- these
    # are one-shot batch jobs, not request-serving code, so they don't need
    # the async engine the app uses everywhere else.
    "psycopg[binary]>=3.2.0",
    # Embedding generation (REBUILD_PLAN F): all-MiniLM-L6-v2, 384 dims,
    # ONNX runtime -- no PyTorch, no GPU required.
    "fastembed>=0.4.0",
    # AI assistant (services/assistant.py). Grounded strictly in
    # RecommendationService output -- see that module's docstring. Both
    # providers are plain dependencies; each SDK is imported lazily inside
    # its own provider module (services/providers/), so selecting one
    # provider via LLM_PROVIDER never requires the other's credentials.
    "google-genai>=0.7.0",  # default dev provider -- has a free tier
    "anthropic>=0.70.0",  # optional, paid
    # Rate limiting (core/rate_limit.py). In-memory backend by default --
    # correct for a single instance, and the documented upgrade path to a
    # Redis backend is a one-line storage_uri change, not a rewrite.
    "slowapi>=0.1.9",
    # Auth (core/security.py). bcrypt directly, not passlib -- passlib is
    # effectively unmaintained and has had version-detection breakage
    # against recent bcrypt releases; the bcrypt package's own hashpw/
    # checkpw API is all password hashing needs here. PyJWT for access
    # tokens (HS256, short-lived, stateless) -- refresh tokens are NOT JWTs,
    # see db/models/user.py's RefreshToken and core/security.py.
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    # Required for pydantic's EmailStr (core/schemas use it on the
    # registration/login request bodies) -- pydantic raises an ImportError
    # at class-definition time otherwise.
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schememedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets tests import shared helpers from tests.conftest.
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These six share fixtures (client, fastapi_app) imported from
# tests/_account_fixtures.py rather than each redefining them locally --
# every test function's own `client` parameter then reads, to a plain
# import-unaware linter, as "redefining" that import. It is the correct
# pytest pattern (a fixture's registered name comes from its function's
# __name__, not from what it's imported as -- see
# tests/_account_fixtures.py's module docstring), not a real unused/
# shadowed import.
"tests/test_auth_routes.py" = ["F811"]
"tests/test_profile_routes.py" = ["F811"]
"tests/test_saved_schemes_routes.py" = ["F811"]
"tests/test_recommendations_me_routes.py" = ["F811"]
"tests/test_likes_routes.py" = ["F811"]
"tests/test_comments_routes.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
